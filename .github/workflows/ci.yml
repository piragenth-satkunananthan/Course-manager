# Every push: lint, typecheck, audit, unit, integration and end-to-end tests. On main: build and push images (design file 80).
name: CI
on:
  push:
  pull_request:

permissions: { contents: read }

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: course_manager_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U app" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL_TEST: postgres://app:app@localhost:5432/course_manager_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run audit
      - run: npm test
      - run: npm run test:int
      - run: npm run build
        env:
          DATABASE_URL: postgres://build
          APP_ORIGIN: http://build.invalid
          BETTER_AUTH_SECRET: build-only-placeholder-secret-000000
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with: { name: playwright-report, path: test-results, retention-days: 7 }

  images:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        target: [web, worker]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/course-manager-${{ matrix.target }}:${{ github.sha }}
          # Links the package to this repo, so the deploy job's GITHUB_TOKEN can pull it.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
